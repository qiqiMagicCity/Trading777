<?xml version="1.0" encoding="UTF-8"?>
<svg width="768" height="768" viewBox="0 0 768 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucky clover logo">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#B8F0C2"/>
  
  <!-- Clover group -->
  <g fill="#128C57" transform="translate(384,384)">
    <!-- Top leaf -->
    <path d="M 0 -30 C -30 -60 -75 -15 0 40 C 75 -15 30 -60 0 -30 Z" transform="translate(0,-150) scale(1.25)"/>
    <!-- Right leaf -->
    <path d="M 0 -30 C -30 -60 -75 -15 0 40 C 75 -15 30 -60 0 -30 Z" transform="translate(150,0) rotate(90) scale(1.25)"/>
    <!-- Bottom leaf -->
    <path d="M 0 -30 C -30 -60 -75 -15 0 40 C 75 -15 30 -60 0 -30 Z" transform="translate(0,150) rotate(180) scale(1.25)"/>
    <!-- Left leaf -->
    <path d="M 0 -30 C -30 -60 -75 -15 0 40 C 75 -15 30 -60 0 -30 Z" transform="translate(-150,0) rotate(270) scale(1.25)"/>
    <!-- Stem (attached near bottom-right) -->
    <path d="M 20 60 C 70 120 10 170 0 200 C 40 140 50 100 20 60 Z" transform="translate(60,130) scale(1.0)"/>
  </g>

  <!-- Sparkle -->
  <g fill="#F6B70A" transform="translate(564,224)">
    <path d="M 0 -45 C 8 -20 20 -8 45 0 C 20 8 8 20 0 45 C -8 20 -20 8 -45 0 C -20 -8 -8 -20 0 -45 Z"/>
  </g>
  
  <!-- Editable color tokens -->
  <metadata>
    Colors: background=#B8F0C2, leaf=#128C57, sparkle=#F6B70A
    Edit the HEX values above or target groups by order: rect (bg), first &lt;g&gt; (leaf), last &lt;g&gt; (sparkle).
  </metadata>
</svg>
