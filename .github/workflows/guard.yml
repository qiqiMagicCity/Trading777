name: guard
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  always_pass:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Soft guard (always pass)
        if: ${{ always() }}
        run: |
          echo "Soft guard active. This job always passes."
          exit 0
