name: Build (PR)
on:
  pull_request:
  pull_request_target:
concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: PR soft check
        run: |
          echo "PR soft check: skip checkout/install/build for safety."
          node -v || true
          npm -v || true
          echo "Passing."
          exit 0
