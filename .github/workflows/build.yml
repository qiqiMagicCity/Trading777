name: Build (PR)
on:
  pull_request:
  pull_request_target:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Detect fork
        id: ctx
        run: |
          echo "fork=${{ github.event.pull_request.head.repo.fork }}" >> $GITHUB_OUTPUT

      - name: Checkout (non-fork)
        if: steps.ctx.outputs.fork != 'true'
        uses: actions/checkout@v4

      - name: Safe check for forks
        if: steps.ctx.outputs.fork == 'true'
        run: |
          node -v
          npm -v
          echo "Fork PR -> skip install/build to avoid secret/registry issues. Pass."
          exit 0

      - name: Setup Node
        if: steps.ctx.outputs.fork != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        if: steps.ctx.outputs.fork != 'true'
        run: npm ci

      - name: Build
        if: steps.ctx.outputs.fork != 'true'
        run: npm run build --if-present
