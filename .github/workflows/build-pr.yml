name: Build (PR)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR HEAD (no secrets)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        env: { CI: 'true' }
        run: npm ci

      # 留作以后需要时再开启
      # - name: Lint
      #   run: npm run lint

      - name: Build (monorepo-friendly)
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run build --workspaces --if-present || npm run build --if-present
