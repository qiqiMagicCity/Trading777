name: time-guards
on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  time-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: ESLint (time rules)
        run: npm run lint:time
      - name: Time Selfcheck
        run: npm run time:selfcheck
      - name: Upload selfcheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-time-reports
          path: |
            selfcheck-time.json
            selfcheck-time.md
