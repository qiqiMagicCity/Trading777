name: Build (main)
on:
  push:
    branches: [ main ]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Guard calcmetrics daily snapshot
        run: npm run check:calcmetrics-daily
      - name: Test (if present)
        run: npm test --if-present -- --runInBand
      - name: Build (if present)
        run: npm run build --if-present
